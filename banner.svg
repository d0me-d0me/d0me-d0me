<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="d0me — offensive and defensive security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0E10"/>
      <stop offset="1" stop-color="#080809"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="42%" r="60%">
      <stop offset="0" stop-color="#48B44A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#48B44A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000000" opacity="0.20"/>
    </pattern>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="108%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="0" y="0" width="900" height="240" rx="8" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="240" rx="8" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="897" height="237" rx="7" fill="none" stroke="#2A2620" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="897" height="237" rx="7" fill="none" stroke="#48B44A" stroke-width="1.5" stroke-opacity="0.22"/>

  <!-- title bar -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <circle cx="26" cy="26" r="5" fill="#E5533B" fill-opacity="0.75"/>
    <circle cx="46" cy="26" r="5" fill="#E5A03B" fill-opacity="0.75"/>
    <circle cx="66" cy="26" r="5" fill="#48B44A" fill-opacity="0.75"/>
    <text x="884" y="30" text-anchor="end" font-size="12" fill="#615C50">— d0me — field-references — 80×24</text>
  </g>
  <line x1="16" y1="46" x2="884" y2="46" stroke="#2A2620" stroke-width="1"/>

  <!-- body -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <text x="40" y="92" font-size="15" fill="#8F8875"><tspan fill="#F2F4EA" font-weight="700">d0me</tspan>:~$ ./whoami --refs</text>

    <text x="40" y="150" font-size="46" font-weight="700" fill="#F2F4EA" letter-spacing="-1" filter="url(#soft)">Security Field Refs<tspan dx="6" fill="#48B44A">_</tspan></text>

    <text x="42" y="188" font-size="14" fill="#D9DCCF">offensive &amp; defensive &#183; labs &#183; CTFs &#183; disclosed CVEs</text>
  </g>

  <!-- meta strip -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12">
    <line x1="40" y1="206" x2="860" y2="206" stroke="#2A2620" stroke-width="1"/>
    <text x="40" y="226" fill="#615C50">
      <tspan fill="#8F8875">build</tspan> <tspan fill="#48B44A" font-weight="700">ok</tspan>
      <tspan fill="#615C50">&#183;</tspan> <tspan fill="#8F8875">offensive</tspan> <tspan fill="#D9DCCF" font-weight="700">/</tspan> <tspan fill="#8F8875">defensive</tspan>
      <tspan fill="#615C50">&#183;</tspan> <tspan fill="#8F8875">data</tspan> <tspan fill="#D9DCCF" font-weight="700">placeholders only</tspan>
    </text>
  </g>

  <!-- scanlines on top -->
  <rect x="1.5" y="1.5" width="897" height="237" rx="7" fill="url(#scan)"/>
</svg>
